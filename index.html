<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш Дім</title>
<meta name="theme-color" content="#16283A">
<meta name="description" content="Home app: fridge, shopping, meal plans, expenses, goals, todos, calendar and ideas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наш Дім">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/base.css">
<!-- Shell only. Every screen lives in features/<id>/ — see CLAUDE.md. -->
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">Наш Дім</h1>
    <div class="top-r">
      <span class="count" id="count"></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Налаштування" aria-pressed="false">⚙️</button>
    </div>
  </div>
  <nav class="views" id="views" aria-label="Розділи"></nav>
  <div id="viewsHost"></div>
</div>

<button class="fab" id="fab" hidden></button>

<div class="auth" id="auth" hidden>
  <form class="auth-box" id="authForm">
    <h1>🏠 Наш Дім</h1>
    <p>Введи пароль дому — він однаковий для вас обох.</p>
    <input class="inp" type="password" id="aPass" autocomplete="current-password" placeholder="Пароль" required>
    <div class="actions"><button class="btn btn-main" type="submit">Увійти</button></div>
    <div class="auth-msg" id="aMsg" role="status"></div>
  </form>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script type="module" src="app/main.js"></script>
</body>
</html>
